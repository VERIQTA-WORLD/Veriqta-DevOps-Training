<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
<title id="title">Know Your Linux Environment</title>
<desc id="desc">Check separate facts before you change the system. Teaching diagram, not observed terminal output.</desc>
<rect width="1080" height="1350" fill="#f6f8f7"/>
<g font-family="Arial, sans-serif">
<rect x="78" y="70" width="924" height="8" fill="#00382F"/>
<text x="78" y="125" font-size="22" fill="#00382F">VERIQTA DevOps Training, Day 001</text>
<text x="78" y="184" font-size="37" font-weight="bold" fill="#00382F">Know Your Linux Environment</text>
<text x="78" y="226" font-size="23" fill="#47524f">Check separate facts before you change the system.</text>
<rect x="78" y="272" width="924" height="195" rx="12" fill="white" stroke="#cbd8d3"/>
<text x="105" y="315" font-size="26" font-weight="bold" fill="#00382F">1. Terminal and Bash</text>
<text x="105" y="358" font-size="24" fill="#24302b">Your terminal shows input and output.</text>
<text x="105" y="393" font-size="24" fill="#24302b">Bash interprets the command you enter.</text>
<rect x="78" y="492" width="924" height="195" rx="12" fill="white" stroke="#cbd8d3"/>
<text x="105" y="535" font-size="26" font-weight="bold" fill="#00382F">2. Kernel and distribution</text>
<text x="105" y="578" font-size="24" fill="#24302b">uname -s identifies the visible kernel family.</text>
<text x="105" y="613" font-size="24" fill="#24302b">/etc/os-release identifies the distribution.</text>
<rect x="78" y="712" width="924" height="195" rx="12" fill="white" stroke="#cbd8d3"/>
<text x="105" y="755" font-size="26" font-weight="bold" fill="#00382F">3. Identity and location</text>
<text x="105" y="798" font-size="24" fill="#24302b">id -u checks your numeric identity.</text>
<text x="105" y="833" font-size="24" fill="#24302b">pwd shows your current working directory.</text>
<rect x="78" y="932" width="924" height="195" rx="12" fill="white" stroke="#cbd8d3"/>
<text x="105" y="975" font-size="26" font-weight="bold" fill="#00382F">4. Your private workspace</text>
<text x="105" y="1018" font-size="24" fill="#24302b">Create your practice folder under your home directory.</text>
<text x="105" y="1053" font-size="24" fill="#24302b">Record observations in baseline.md.</text>
<text x="78" y="1195" font-size="23" fill="#47524f">One command cannot prove the whole environment.</text>
<text x="78" y="1240" font-size="21" fill="#47524f">Teaching diagram. Follow the lab for actual commands.</text>
<text x="1002" y="1290" text-anchor="end" font-size="24" fill="#00382F" opacity="0.28">VERIQTA</text>
</g></svg>
