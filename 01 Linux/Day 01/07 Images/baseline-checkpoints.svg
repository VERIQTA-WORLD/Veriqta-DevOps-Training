<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
<title id="title">Verify Your First Baseline</title>
<desc id="desc">A saved file and an explained result are different checks. Teaching diagram, not observed terminal output.</desc>
<rect width="1080" height="1350" fill="#f6f8f7"/>
<g font-family="Arial, sans-serif">
<rect x="78" y="70" width="924" height="8" fill="#00382F"/>
<text x="78" y="125" font-size="22" fill="#00382F">VERIQTA DevOps Training, Day 01</text>
<text x="78" y="184" font-size="37" font-weight="bold" fill="#00382F">Verify Your First Baseline</text>
<text x="78" y="226" font-size="23" fill="#47524f">A saved file and an explained result are different checks.</text>
<rect x="78" y="272" width="924" height="195" rx="12" fill="white" stroke="#cbd8d3"/>
<text x="105" y="315" font-size="26" font-weight="bold" fill="#00382F">1. Inspect</text>
<text x="105" y="358" font-size="24" fill="#24302b">Read the actual environment and identity results.</text>
<text x="105" y="393" font-size="24" fill="#24302b">Record the capture time and your workspace path.</text>
<rect x="78" y="492" width="924" height="195" rx="12" fill="white" stroke="#cbd8d3"/>
<text x="105" y="535" font-size="26" font-weight="bold" fill="#00382F">2. Record</text>
<text x="105" y="578" font-size="24" fill="#24302b">Use vi to save your observations in baseline.md.</text>
<text x="105" y="613" font-size="24" fill="#24302b">Replace every example placeholder with evidence.</text>
<rect x="78" y="712" width="924" height="195" rx="12" fill="white" stroke="#cbd8d3"/>
<text x="105" y="755" font-size="26" font-weight="bold" fill="#00382F">3. Reopen</text>
<text x="105" y="798" font-size="24" fill="#24302b">Leave the directory, return, and read the file.</text>
<text x="105" y="833" font-size="24" fill="#24302b">Check that the saved values are still present.</text>
<rect x="78" y="932" width="924" height="195" rx="12" fill="white" stroke="#cbd8d3"/>
<text x="105" y="975" font-size="26" font-weight="bold" fill="#00382F">4. Explain</text>
<text x="105" y="1018" font-size="24" fill="#24302b">Distinguish facts from assumptions and limitations.</text>
<text x="105" y="1053" font-size="24" fill="#24302b">A readable baseline does not prove service health.</text>
<text x="78" y="1195" font-size="23" fill="#47524f">Keep raw system details private. Share reviewed evidence.</text>
<text x="78" y="1240" font-size="21" fill="#47524f">Teaching diagram. Follow the lab for actual commands.</text>
<text x="1002" y="1290" text-anchor="end" font-size="24" fill="#00382F" opacity="0.28">VERIQTA</text>
</g></svg>
