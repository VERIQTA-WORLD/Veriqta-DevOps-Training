<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
<title id="title">Demonstrate Day 01 Independently</title>
<desc id="desc">Your result must be saved, accurate, and explainable. Teaching diagram, not terminal evidence.</desc>
<rect width="1080" height="1350" fill="#f6f8f7"/>
<g font-family="Arial, sans-serif">
<rect x="78" y="70" width="924" height="8" fill="#00382F"/>
<text x="78" y="125" font-size="22" fill="#00382F">VERIQTA DevOps Training, Linux Day 01</text>
<text x="78" y="184" font-size="36" font-weight="bold" fill="#00382F">Demonstrate Day 01 Independently</text>
<text x="78" y="226" font-size="23" fill="#47524f">Your result must be saved, accurate, and explainable.</text>
<rect x="78" y="272" width="924" height="195" rx="12" fill="white" stroke="#cbd8d3"/>
<text x="105" y="315" font-size="26" font-weight="bold" fill="#00382F">1. Locate</text>
<text x="105" y="358" font-size="24" fill="#24302b">Start outside your practice directory.</text>
<text x="105" y="393" font-size="24" fill="#24302b">Find the existing baseline without recreating it.</text>
<rect x="78" y="492" width="924" height="195" rx="12" fill="white" stroke="#cbd8d3"/>
<text x="105" y="535" font-size="26" font-weight="bold" fill="#00382F">2. Verify</text>
<text x="105" y="578" font-size="24" fill="#24302b">Check your identity and environment values.</text>
<text x="105" y="613" font-size="24" fill="#24302b">Compare actual output with your record.</text>
<rect x="78" y="712" width="924" height="195" rx="12" fill="white" stroke="#cbd8d3"/>
<text x="105" y="755" font-size="26" font-weight="bold" fill="#00382F">3. Record</text>
<text x="105" y="798" font-size="24" fill="#24302b">Create and save your independent assessment.</text>
<text x="105" y="833" font-size="24" fill="#24302b">Read it back from the shell.</text>
<rect x="78" y="932" width="924" height="195" rx="12" fill="white" stroke="#cbd8d3"/>
<text x="105" y="975" font-size="26" font-weight="bold" fill="#00382F">4. Explain</text>
<text x="105" y="1018" font-size="24" fill="#24302b">Distinguish kernel, distribution, and filesystem.</text>
<text x="105" y="1053" font-size="24" fill="#24302b">State the limits and your next checkpoint.</text>
<text x="78" y="1195" font-size="23" fill="#47524f">Pass only when every observable criterion is met.</text>
<text x="78" y="1240" font-size="21" fill="#47524f">Teaching diagram. Use actual output for your evidence.</text>
<text x="1002" y="1290" text-anchor="end" font-size="24" fill="#00382F" opacity="0.28">VERIQTA</text>
</g></svg>
