<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
<title id="title">Show the Whole Evidence Chain</title>
<desc id="desc">A written pass claim is not a substitute for an observed result. Teaching diagram, not observed terminal output.</desc>
<rect width="1080" height="1350" fill="#f6f8f7"/>
<g font-family="Arial, sans-serif">
<rect x="78" y="70" width="924" height="8" fill="#00382F"/>
<text x="78" y="125" font-size="22" fill="#00382F">VERIQTA DevOps Training, Linux Day 02</text>
<text x="78" y="184" font-size="36" font-weight="bold" fill="#00382F">Show the Whole Evidence Chain</text>
<text x="78" y="226" font-size="23" fill="#47524f">A written pass claim is not a substitute for an observed result.</text>
<rect x="78" y="272" width="924" height="195" rx="12" fill="white" stroke="#cbd8d3"/>
<text x="105" y="315" font-size="26" font-weight="bold" fill="#00382F">1. Starting state</text>
<text x="105" y="358" font-size="24" fill="#24302b">Record the real location and relevant file contents.</text>
<text x="105" y="393" font-size="24" fill="#24302b">Preserve the original before replacing anything.</text>
<rect x="78" y="492" width="924" height="195" rx="12" fill="white" stroke="#cbd8d3"/>
<text x="105" y="535" font-size="26" font-weight="bold" fill="#00382F">2. Operation</text>
<text x="105" y="578" font-size="24" fill="#24302b">Identify the selected source and target.</text>
<text x="105" y="613" font-size="24" fill="#24302b">Record unexpected errors and prompts.</text>
<rect x="78" y="712" width="924" height="195" rx="12" fill="white" stroke="#cbd8d3"/>
<text x="105" y="755" font-size="26" font-weight="bold" fill="#00382F">3. Verification</text>
<text x="105" y="798" font-size="24" fill="#24302b">Keep comparison results and final readable content.</text>
<text x="105" y="833" font-size="24" fill="#24302b">Demonstrate a successful return to the saved workspace.</text>
<rect x="78" y="932" width="924" height="195" rx="12" fill="white" stroke="#cbd8d3"/>
<text x="105" y="975" font-size="26" font-weight="bold" fill="#00382F">4. Public review</text>
<text x="105" y="1018" font-size="24" fill="#24302b">Retain originals privately; publish reviewed copies.</text>
<text x="105" y="1053" font-size="24" fill="#24302b">Separate expected examples from actual observations.</text>
<text x="78" y="1195" font-size="23" fill="#47524f">Explain what the result establishes and what it leaves unknown.</text>
<text x="78" y="1240" font-size="21" fill="#47524f">Teaching diagram. Retain your own actual verification.</text>
<text x="1002" y="1290" text-anchor="end" font-size="24" fill="#00382F" opacity="0.28">VERIQTA</text>
</g></svg>
