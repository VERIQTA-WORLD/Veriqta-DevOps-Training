<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
<title id="title">Give Every Directory a Purpose</title>
<desc id="desc">A filename alone does not tell you its operational role. Teaching diagram, not observed terminal output.</desc>
<rect width="1080" height="1350" fill="#f6f8f7"/>
<g font-family="Arial, sans-serif">
<rect x="78" y="70" width="924" height="8" fill="#00382F"/>
<text x="78" y="125" font-size="22" fill="#00382F">VERIQTA DevOps Training, Linux Day 02</text>
<text x="78" y="184" font-size="36" font-weight="bold" fill="#00382F">Give Every Directory a Purpose</text>
<text x="78" y="226" font-size="23" fill="#47524f">A filename alone does not tell you its operational role.</text>
<rect x="78" y="272" width="924" height="195" rx="12" fill="white" stroke="#cbd8d3"/>
<text x="105" y="315" font-size="26" font-weight="bold" fill="#00382F">1. config, active synthetic settings</text>
<text x="105" y="358" font-size="24" fill="#24302b">app.env contains the current training release.</text>
<text x="105" y="393" font-size="24" fill="#24302b">Read its content before making a change.</text>
<rect x="78" y="492" width="924" height="195" rx="12" fill="white" stroke="#cbd8d3"/>
<text x="105" y="535" font-size="26" font-weight="bold" fill="#00382F">2. docs and logs, different evidence</text>
<text x="105" y="578" font-size="24" fill="#24302b">docs holds instructions and your observations.</text>
<text x="105" y="613" font-size="24" fill="#24302b">logs is reserved for later runtime output.</text>
<rect x="78" y="712" width="924" height="195" rx="12" fill="white" stroke="#cbd8d3"/>
<text x="105" y="755" font-size="26" font-weight="bold" fill="#00382F">3. backups, preserved before-change files</text>
<text x="105" y="798" font-size="24" fill="#24302b">Keep a verified copy before replacing active content.</text>
<text x="105" y="833" font-size="24" fill="#24302b">A local copy alone is not a complete backup strategy.</text>
<rect x="78" y="932" width="924" height="195" rx="12" fill="white" stroke="#cbd8d3"/>
<text x="105" y="975" font-size="26" font-weight="bold" fill="#00382F">4. scratch and the hidden marker</text>
<text x="105" y="1018" font-size="24" fill="#24302b">Remove only explicitly approved disposable files.</text>
<text x="105" y="1053" font-size="24" fill="#24302b">.lab-only communicates purpose, not access control.</text>
<text x="78" y="1195" font-size="23" fill="#47524f">Separate source, active state, documentation, and recovery.</text>
<text x="78" y="1240" font-size="21" fill="#47524f">Teaching diagram. Retain your own actual verification.</text>
<text x="1002" y="1290" text-anchor="end" font-size="24" fill="#00382F" opacity="0.28">VERIQTA</text>
</g></svg>
