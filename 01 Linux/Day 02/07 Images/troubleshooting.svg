<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
<title id="title">Diagnose the File Operation</title>
<desc id="desc">Do not turn an unclear symptom into a broad deletion. Teaching diagram, not observed terminal output.</desc>
<rect width="1080" height="1350" fill="#f6f8f7"/>
<g font-family="Arial, sans-serif">
<rect x="78" y="70" width="924" height="8" fill="#00382F"/>
<text x="78" y="125" font-size="22" fill="#00382F">VERIQTA DevOps Training, Linux Day 02</text>
<text x="78" y="184" font-size="36" font-weight="bold" fill="#00382F">Diagnose the File Operation</text>
<text x="78" y="226" font-size="23" fill="#47524f">Do not turn an unclear symptom into a broad deletion.</text>
<rect x="78" y="272" width="924" height="195" rx="12" fill="white" stroke="#cbd8d3"/>
<text x="105" y="315" font-size="26" font-weight="bold" fill="#00382F">1. Inspect the context</text>
<text x="105" y="358" font-size="24" fill="#24302b">Check working directory, account, and exact filenames.</text>
<text x="105" y="393" font-size="24" fill="#24302b">Include hidden entries when inspecting a directory.</text>
<rect x="78" y="492" width="924" height="195" rx="12" fill="white" stroke="#cbd8d3"/>
<text x="105" y="535" font-size="26" font-weight="bold" fill="#00382F">2. Read the selected files</text>
<text x="105" y="578" font-size="24" fill="#24302b">Confirm source and destination contents.</text>
<text x="105" y="613" font-size="24" fill="#24302b">Decline an unexpected overwrite prompt.</text>
<rect x="78" y="712" width="924" height="195" rx="12" fill="white" stroke="#cbd8d3"/>
<text x="105" y="755" font-size="26" font-weight="bold" fill="#00382F">3. Interpret the comparison</text>
<text x="105" y="798" font-size="24" fill="#24302b">Zero means equal; one means content differs.</text>
<text x="105" y="833" font-size="24" fill="#24302b">A higher status means comparison trouble.</text>
<rect x="78" y="932" width="924" height="195" rx="12" fill="white" stroke="#cbd8d3"/>
<text x="105" y="975" font-size="26" font-weight="bold" fill="#00382F">4. Verify a bounded correction</text>
<text x="105" y="1018" font-size="24" fill="#24302b">Repeat the check that originally failed.</text>
<text x="105" y="1053" font-size="24" fill="#24302b">Preserve unknown files and your earlier evidence.</text>
<text x="78" y="1195" font-size="23" fill="#47524f">Change the smallest understood part of the lab.</text>
<text x="78" y="1240" font-size="21" fill="#47524f">Teaching diagram. Retain your own actual verification.</text>
<text x="1002" y="1290" text-anchor="end" font-size="24" fill="#00382F" opacity="0.28">VERIQTA</text>
</g></svg>
